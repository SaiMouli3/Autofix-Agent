# Render Blueprint for ecommerce-ai-os: public Next.js web, private Go API, Postgres, Key Value (Redis).
# Secrets: EXP_LABS_API_KEY is prompted for in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: eaos-web
    runtime: docker
    dockerContext: ./ecommerce-ai-os/web
    dockerfilePath: ./ecommerce-ai-os/web/Dockerfile
    plan: free
    healthCheckPath: /login
    envVars:
      # Next.js bakes rewrites at build time; Render passes env vars to Docker builds as build args.
      - key: API_URL
        fromService:
          type: pserv
          name: eaos-api
          property: hostport

  - type: pserv
    name: eaos-api
    runtime: docker
    dockerContext: ./ecommerce-ai-os/api
    dockerfilePath: ./ecommerce-ai-os/api/Dockerfile
    plan: starter
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eaos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: eaos-kv
          property: connectionString
      - key: EXP_LABS_API_KEY
        sync: false
      - key: EXP_LABS_BASE_URL
        value: https://api.experientiallabs.ai/v1
      - key: EXP_LABS_MODEL
        value: gpt-5-mini

  - type: keyvalue
    name: eaos-kv
    plan: free
    ipAllowList: []

databases:
  - name: eaos-db
    plan: free
    databaseName: eaos
    user: eaos
