[project]
name = "synchronous-consulting-ai"
version = "0.1.0"
description = "Synchronous Consulting AI - multi-agent operations platform built on the OpenHands Software Agent SDK"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "openhands-sdk==1.53.0",
  "openhands-tools==1.53.0",
  "openhands-workspace==1.53.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "email-validator>=2.1",
  "pydantic-settings>=2.3",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "croniter>=2.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "fastmcp>=2.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = [
  "live: requires a real model provider (EXP_LABS_API_KEY) and network access",
  "docker: requires a running Docker daemon and the OpenHands agent-server image",
]

[tool.ruff]
line-length = 100
target-version = "py312"
