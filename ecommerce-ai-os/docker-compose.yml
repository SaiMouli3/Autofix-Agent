# Full stack: Postgres + Redis + Go API + Next.js web.
#   docker compose up --build   →   http://localhost:3000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eaos
      POSTGRES_PASSWORD: eaos
      POSTGRES_DB: eaos
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaos"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  api:
    build: ./api
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://eaos:eaos@postgres:5432/eaos?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      EXP_LABS_API_KEY: ${EXP_LABS_API_KEY:-}
      EXP_LABS_BASE_URL: ${EXP_LABS_BASE_URL:-https://api.experientiallabs.ai/v1}
      EXP_LABS_MODEL: ${EXP_LABS_MODEL:-claude-opus-5.5}
      EXP_LABS_PROTOCOL: ${EXP_LABS_PROTOCOL:-openai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8080:8080"]
  web:
    build:
      context: ./web
      args: { API_URL: http://api:8080 }
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
